name: Bug report
description: Something wrong with the website, the CLI, or an entry.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - CLI (@helloagents/cli)
        - Website
        - A registry entry
        - Registry build or CI
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the command you ran and its full output, if relevant.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "CLI 0.1.0, Node 20.11, macOS 15"
