packages:
  - apps/*
  - packages/*

# Packages whose install scripts may run.
allowBuilds:
  # The Electron binary comes from the desktop app's postinstall (install-electron).
  electron: false
  # Only used to build Windows installers.
  electron-winstaller: false
  esbuild: true
  # The terminal uses node-pty's prebuilt binaries; nothing to compile.
  node-pty: false
