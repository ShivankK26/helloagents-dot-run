# Packages the built app (out/) into a .dmg. Everything the app needs is
# bundled by electron-vite, except node-pty (the terminal's native module).
appId: run.helloagents.app
productName: helloagents
copyright: Copyright © 2026 Shivank Kapur
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # Only node-pty's macOS binaries; not its sources or Windows builds.
  - "!node_modules/node-pty/{src,deps,third_party,scripts,typings,binding.gyp}/**"
  - "!node_modules/node-pty/prebuilds/win32-*/**"
asar: true
# Native code can't load from inside the archive.
asarUnpack:
  - node_modules/node-pty/**
# node-pty ships prebuilt binaries for both chips; never compile it.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: universal
  # No Apple Developer ID yet: sign ad hoc so Apple silicon will run it.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  # node-pty carries a binary per chip in both halves of the universal app.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/**"
dmg:
  title: helloagents
  # A stable name, so /releases/latest/download/helloagents-mac.dmg always works.
  artifactName: helloagents-mac.dmg
